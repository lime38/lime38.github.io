---
layout: default
---
<article class="post h-entry" itemscope itemtype="https://schema.org/BlogPosting">

  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%Y-%m-%d" }}</time>
      {%- for tag in page.tags %} · <span class="post-tag">#{{ tag }}</span>{% endfor %}
    </p>
    {%- if page.canonical_url %}
    <p class="mirror-note">이 글은 잘하나 블로그의 글을 옮겨 실은 것입니다. 정본은 <a class="u-canonical" href="{{ page.canonical_url }}">잘하나 블로그 원문 — {{ page.title | escape }}</a>입니다.</p>
    {%- endif %}
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div>

  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>

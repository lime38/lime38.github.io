<footer class="site-footer h-card">
  <data class="u-url" href="{{ '/' | relative_url }}"></data>
  <div class="wrapper">
    <p class="footer-heading">{{ site.title | escape }} — 잘하나 블로그의 글을 옮겨 실은 사이트입니다</p>
    <nav class="footer-channels" aria-label="채널">
      <span class="footer-title">채널</span>
      {%- for c in site.data.links.channels %}
      {%- if c.url and c.url != "" %}
      <a href="{{ c.url }}"{% if c.rel and c.rel != "" %} rel="{{ c.rel }}"{% endif %}>{{ c.label }}</a>
      {%- endif %}
      {%- endfor %}
    </nav>
    <p class="footer-note">잘하나는 편집은 하되 판정은 하지 않습니다. 이 사이트의 글은 모두 jalhana.com/blog 의 원문을 정본으로 합니다.</p>
  </div>
</footer>

{%- assign off = include.offset | default: 0 -%}
<ul class="post-list">
{%- for post in site.posts offset: off limit: include.limit %}
  <li>
    <span class="post-meta">{{ post.date | date: "%Y-%m-%d" }}{% for tag in post.tags %} · #{{ tag }}{% endfor %}</span>
    <h3><a class="post-link" href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h3>
  </li>
{%- endfor %}
</ul>

# 잘하나 기록 — GitHub Pages(Jekyll) 거울 사이트. 화이트리스트 플러그인만 사용한다.
title: 잘하나 기록
tagline: 지방의회 기록을 편집하는 과정
description: 잘하나가 지방의회 기록을 읽고 편집하는 과정을 적은 글 모음으로, 글의 원문(정본)은 jalhana.com/blog에 있습니다.
url: https://lime38.github.io
baseurl: ""
lang: ko
locale: ko_KR
timezone: Asia/Seoul
author:
  name: 잘하나
  url: https://jalhana.com/

# jekyll-seo-tag: 게시자 로고(JSON-LD publisher.logo, 저장소 안 /assets 파일)와 트위터 카드
logo: /assets/jalhana-512.png
twitter:
  username: jalhana12
  card: summary_large_image

# 검색엔진 소유 확인 — 값이 있을 때만 head 에 meta 가 나온다(_includes/head-custom.html).
google_site_verification: "XilFOhUF8SeFzf5YCJ9qJ5AMqmsaElu2fVjnc4BQqnM"
bing_site_verification: ""

# jekyll-seo-tag: 홈 JSON-LD 의 sameAs (프로필 주소). 푸터 채널(_data/links.json)과 같은 목록.
social:
  type: Organization
  name: 잘하나
  links:
    - https://www.threads.com/@lime.jung
    - https://www.instagram.com/jalhana_official/
    - https://x.com/jalhana12
    - https://www.linkedin.com/in/lime38/
    - https://brunch.co.kr/@jalhana12
    - https://velog.io/@jalhana
    - https://github.com/lime38

theme: minima

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

# 글 주소: /blog/<slug>/  (파일명 _posts/YYYY-MM-DD-<slug>.md 의 slug)
permalink: /blog/:title/

# 원문의 줄바꿈 리듬을 jalhana.com 과 같게 보이도록 한다(원문 md 는 수정하지 않는다).
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true
  smart_quotes: apos,apos,quot,quot

minima:
  date_format: "%Y-%m-%d"

# 기본 공유 이미지 = 이 저장소의 /assets/og-default.png (글이 자기 image 를 가지면 그것이 이긴다).
# 글의 image 에 가로세로를 모를 때는 exporter 가 width/height 를 null 로 적어 이 값이 섞이지 않게 한다.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/og-default.png
        alt: 잘하나
        width: 1200
        height: 630
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author:
        name: 잘하나
        url: https://jalhana.com/

exclude:
  - README.md
  - tools
  - preview
  - .gitignore
